services:
  mysql:
    image: mysql:8.4
    container_name: cyphersquad-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cyphersquad_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyphersquad-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cyphersquad_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/transaction-monitoring-ui
      dockerfile: Dockerfile
    container_name: cyphersquad-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data: